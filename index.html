<!--
  DOPA SNAKE
  1ファイル完結・ビルド不要。リポジトリ直下に index.html として置き、
  Settings → Pages で公開ブランチを選べばそのまま動きます。
  フォントだけ Google Fonts から読みます(読めなくても代替フォントで動作)。
-->
<style>
:root{
  --bg:#06030d; --ink:#f6f1ff; --dim:#a99dc8;
  --mag:#ff2bd6; --cy:#21f3ff; --yel:#f6ff3a;
  --f-disp:"Dela Gothic One","Hiragino Kaku Gothic StdN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-num:"Chakra Petch","Avenir Next Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --f-ui:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{font-family:var(--f-ui);font-weight:700}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#probe{position:fixed;left:0;bottom:0;width:1px;height:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none}

/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:2;margin:0 auto;max-width:980px;
  display:grid;grid-template-columns:1fr auto;align-items:end;gap:8px 12px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;pointer-events:none}
.stat{display:flex;flex-direction:column;gap:3px;line-height:1}
.stat.r{align-items:flex-end}
.lbl{font-size:11px;letter-spacing:.08em;color:var(--dim)}
#score{font:italic 700 clamp(32px,9.5vw,46px)/1 var(--f-num);font-variant-numeric:tabular-nums;
  text-shadow:0 0 16px rgba(33,243,255,.75);transform-origin:left bottom}
#best{font:italic 700 clamp(17px,4.8vw,22px)/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--yel)}
.row2{grid-column:1/-1;display:flex;align-items:center;gap:8px}
#lvChip{font:italic 700 14px/1 var(--f-num);padding:6px 9px;border:1.5px solid currentColor;border-radius:7px;color:var(--cy);white-space:nowrap}
#gauge{flex:1;position:relative;height:18px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16)}
#gaugeFill{position:absolute;inset:0;transform-origin:left center;transform:scaleX(0);
  background:linear-gradient(90deg,var(--mag),var(--yel))}
#gaugeLbl{position:absolute;inset:0;display:grid;place-items:center;font:italic 700 11px/1 var(--f-num);letter-spacing:.24em;
  color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9)}
body.fever #gaugeFill{background:linear-gradient(90deg,#ff2b6a,#ffd21f,#3dff8b,#21f3ff,#b04bff,#ff2b6a);background-size:200% 100%;animation:slide .5s linear infinite}
body.fever #gauge{box-shadow:inset 0 0 0 1.5px #fff,0 0 18px var(--mag)}
@keyframes slide{to{background-position:-200% 0}}
.btns{display:flex;gap:6px;pointer-events:auto}
.btns button{width:40px;height:34px;border-radius:9px;border:1.5px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);
  color:var(--ink);font:italic 700 13px/1 var(--f-num);cursor:pointer;touch-action:manipulation}
.btns button.off{color:#6d6388;border-color:rgba(255,255,255,.1);text-decoration:line-through}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--yel);outline-offset:3px}

/* ---------- 画面中央のかけ声 ---------- */
#callouts{position:fixed;left:0;right:0;top:30%;z-index:3;display:grid;place-items:center;pointer-events:none}
.callout{--h:320;grid-area:1/1;font:400 15vw/1 var(--f-disp);color:#fff;white-space:nowrap;
  text-shadow:0 0 14px hsl(var(--h) 100% 60%),0 0 46px hsl(var(--h) 100% 50%),
    .06em .06em 0 hsl(calc(var(--h) + 150) 100% 50%),-.03em -.03em 0 hsl(calc(var(--h) - 60) 100% 55%);
  animation:callout .95s cubic-bezier(.2,1.5,.35,1) forwards}
.callout.low{margin-top:24vh;animation-duration:1.1s}
@keyframes callout{
  0%{opacity:0;transform:rotate(-7deg) skewX(-10deg) scale(2.8)}
  16%{opacity:1;transform:rotate(-7deg) skewX(-10deg) scale(1)}
  72%{opacity:1;transform:rotate(-7deg) skewX(-10deg) scale(1.07)}
  100%{opacity:0;transform:rotate(-7deg) skewX(-10deg) scale(1.3) translateY(-18px)}}
body.soft .callout{animation-name:calloutSoft}
@keyframes calloutSoft{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}

/* ---------- オーバーレイ ---------- */
.ov{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:20px;
  background:radial-gradient(ellipse at center,rgba(6,3,13,.42),rgba(6,3,13,.86));
  opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s}
.ov.show{opacity:1;visibility:visible}
.panel{width:min(100%,440px);display:grid;gap:18px;justify-items:center;text-align:center}
.kicker{font:400 15px/1 var(--f-disp);color:var(--cy);letter-spacing:.12em}
.logo{display:grid;font:400 clamp(60px,20vw,118px)/.9 var(--f-disp);letter-spacing:-.02em;
  transform:rotate(-5deg) skewX(-8deg);animation:thump .5s ease-out infinite}
.logo span:first-child{color:var(--yel);text-shadow:.05em .05em 0 var(--mag),0 0 42px rgba(246,255,58,.45)}
.logo span:last-child{color:#fff;text-shadow:.05em .05em 0 var(--cy),-.03em -.03em 0 var(--mag),0 0 42px rgba(33,243,255,.55)}
@keyframes ctaThump{0%{transform:rotate(-3deg) scale(1.05)}100%{transform:rotate(-3deg) scale(1)}}
@keyframes thump{0%{transform:rotate(-5deg) skewX(-8deg) scale(1.045)}100%{transform:rotate(-5deg) skewX(-8deg) scale(1)}}
.how{list-style:none;display:grid;gap:7px;font-size:14px;line-height:1.45;color:#dcd3f5;font-weight:600;margin-top:6px}
.how b{color:var(--yel)}
.cta{font:400 22px/1 var(--f-disp);color:#12061f;background:var(--yel);border:0;border-radius:16px;
  padding:19px 34px;min-width:250px;cursor:pointer;touch-action:manipulation;
  box-shadow:6px 6px 0 var(--mag),0 0 34px rgba(246,255,58,.45);animation:ctaThump .5s ease-out infinite}
.cta:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--mag);animation:none}
.ghost{font:700 14px/1 var(--f-ui);color:var(--ink);background:transparent;border:1.5px solid rgba(255,255,255,.3);
  border-radius:12px;padding:13px 22px;cursor:pointer;touch-action:manipulation}
a.ghost{display:inline-block;text-decoration:none}
.bestline{font:italic 700 16px/1 var(--f-num);color:var(--dim)}
.bestline span{color:var(--yel)}
.pausedTxt{font:400 clamp(44px,14vw,84px)/1 var(--f-disp);color:#fff;text-shadow:.05em .05em 0 var(--mag)}
.sub{font-size:14px;color:var(--dim)}

/* ---------- リザルト ---------- */
#result .panel{gap:12px}
.newrec{font:400 22px/1 var(--f-disp);color:var(--yel);text-shadow:.07em .07em 0 var(--mag);opacity:0;transform:rotate(-4deg)}
#result.rec .newrec{opacity:1;animation:blink .32s steps(2) infinite}
@keyframes blink{50%{color:#fff}}
.rank{--rc:#fff;font:400 clamp(110px,36vw,190px)/.92 var(--f-disp);color:var(--rc);opacity:0;
  text-shadow:.045em .045em 0 #fff,0 0 60px var(--rc)}
.rank.l2{font-size:clamp(84px,27vw,150px)}
.rank.l3{font-size:clamp(64px,20vw,120px)}
#result.done .rank{animation:stamp .42s cubic-bezier(.2,1.7,.4,1) forwards}
@keyframes stamp{0%{opacity:0;transform:scale(4.2) rotate(18deg)}100%{opacity:1;transform:scale(1) rotate(-6deg)}}
.msg{font:400 18px/1.2 var(--f-disp);min-height:22px;opacity:0;transition:opacity .25s .15s}
#result.done .msg{opacity:1}
.bigscore{font:italic 700 clamp(48px,15vw,78px)/1 var(--f-num);font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(33,243,255,.8)}
.stats{display:flex;gap:24px;margin:2px 0 10px}
.stats dt{font-size:11px;color:var(--dim);margin-bottom:5px}
.stats dd{font:italic 700 24px/1 var(--f-num)}
/* ---------- シェア ---------- */
#share{display:flex;overflow-y:auto;touch-action:pan-y;background:rgba(6,3,13,.97)}
#share .panel{margin:auto;gap:12px;width:min(100%,400px)}
@media (min-width:700px) and (min-height:700px){#share .panel{width:min(100%,560px)}}
.shareTitle{font:400 22px/1 var(--f-disp);color:var(--yel);text-shadow:.07em .07em 0 var(--mag)}
.cardWrap{position:relative;width:100%;max-width:100%;aspect-ratio:1200/630;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.06);
  box-shadow:0 0 0 1.5px rgba(255,255,255,.2),0 12px 40px rgba(0,0,0,.55)}
#cardImg,.cardWrap canvas{display:block;width:100%;height:100%;opacity:0;transition:opacity .2s}
#cardImg{-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto}
.cardWrap.ready #cardImg,.cardWrap.ready canvas{opacity:1}
#cardImg[hidden]{display:none}
#cardWait{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--dim)}
.cardWrap.ready #cardWait{display:none}
.wide{width:100%}
.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.svcBtn{display:grid;place-items:center;height:44px;border-radius:11px;font:700 14px/1 var(--f-ui);color:#fff;
  text-decoration:none;border:1.5px solid rgba(255,255,255,.28);touch-action:manipulation}
.svcBtn.x,.svcBtn.th{background:#000}
.svcBtn.line{background:#06c755;border-color:#06c755}
.svcBtn.bsky{background:#1185fe;border-color:#1185fe}
.shareBtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#share .shareBtns{width:100%;flex-wrap:nowrap}
#share .shareBtns{gap:8px}
#share .shareBtns .ghost{flex:1;padding:13px 4px;font-size:13px;white-space:nowrap}
#share .shareBtns .ghost[hidden]{display:none}
#shareNote{font-size:12px;line-height:1.5;min-height:18px}
.linkBtn{background:none;border:0;color:var(--dim);font:700 14px/1 var(--f-ui);padding:8px 16px;cursor:pointer;text-decoration:underline}
.solid{font:700 15px/1 var(--f-ui);color:#12061f;background:var(--yel);border:0;border-radius:12px;padding:14px 22px;
  min-width:150px;cursor:pointer;touch-action:manipulation;box-shadow:4px 4px 0 var(--mag)}
.solid:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--mag)}
@media (max-height:620px){
  .how{display:none}
  .panel{gap:10px}
  .rank{font-size:84px}
  .rank.l2{font-size:72px}
  .rank.l3{font-size:60px}
  .bigscore{font-size:46px}
  .stats{margin:0}
  .cta{padding:15px 30px}
}
@media (prefers-reduced-motion:reduce){.logo,.cta{animation:none}}
body.soft .logo,body.soft .cta{animation:none}
</style>
</head>
<body>
<canvas id="game"></canvas>

<header id="hud">
  <div class="stat"><span class="lbl">スコア</span><span id="score">0</span></div>
  <div class="stat r"><span class="lbl">ベスト</span><span id="best">0</span></div>
  <div class="row2">
    <span id="lvChip">Lv.1</span>
    <div id="gauge"><div id="gaugeFill"></div><span id="gaugeLbl">FEVER</span></div>
    <div class="btns">
      <button id="bPause" type="button" aria-label="一時停止">II</button>
      <button id="bSound" type="button" aria-label="サウンド切り替え">♪</button>
      <button id="bFx" type="button" aria-label="画面の揺れと点滅を弱める">FX</button>
    </div>
  </div>
</header>

<div id="callouts"></div>

<section id="title" class="ov show">
  <div class="panel">
    <p class="kicker">脳汁全開ヘビゲーム</p>
    <h1 class="logo"><span>DOPA</span><span>SNAKE</span></h1>
    <ul class="how">
      <li><b>スワイプ</b>か<b>矢印キー</b>で曲がる</li>
      <li>壁はワープ、自分に当たると終了</li>
      <li>続けて食べて<b>コンボ</b>、ゲージ満タンで<b>フィーバー</b></li>
      <li>⭐ 高得点 🧲 吸い寄せ ⚡ しっぽカット</li>
    </ul>
    <button id="bStart" class="cta" type="button">スタート</button>
    <p class="bestline">BEST <span id="tBest">0</span></p>
  </div>
</section>

<section id="pause" class="ov">
  <div class="panel">
    <p class="pausedTxt">ポーズ中</p>
    <p class="sub">タップか Space キーで再開</p>
  </div>
</section>

<section id="result" class="ov">
  <div class="panel">
    <p class="newrec">自己ベスト更新!!</p>
    <div id="rRank" class="rank">S</div>
    <p id="rMsg" class="msg"></p>
    <div id="rScore" class="bigscore">0</div>
    <dl class="stats">
      <div><dt>最大コンボ</dt><dd id="rCombo">0</dd></div>
      <div><dt>長さ</dt><dd id="rLen">0</dd></div>
      <div><dt>レベル</dt><dd id="rLv">1</dd></div>
    </dl>
    <button id="bRetry" class="cta" type="button">もう一回</button>
    <button id="bShare" class="ghost" type="button">スコアをシェア</button>
  </div>
</section>

<section id="share" class="ov" aria-label="スコアをシェア">
  <div class="panel">
    <p class="shareTitle">スコアをシェア</p>
    <div id="cardWrap" class="cardWrap"><img id="cardImg" alt="スコアカード画像"><span id="cardWait">画像を作成中</span></div>
    <button id="bNative" class="solid wide" type="button">画像つきでシェア</button>
    <div class="svc">
      <a id="sX" class="svcBtn x" target="_blank" rel="noopener">X</a>
      <a id="sLine" class="svcBtn line" target="_blank" rel="noopener">LINE</a>
      <a id="sBsky" class="svcBtn bsky" target="_blank" rel="noopener">Bluesky</a>
      <a id="sThreads" class="svcBtn th" target="_blank" rel="noopener">Threads</a>
    </div>
    <div class="shareBtns">
      <button id="bCopy" class="ghost" type="button">文面をコピー</button>
      <button id="bSave" class="ghost" type="button">画像を保存</button>
    </div>
    <p id="shareNote" class="sub" aria-live="polite"></p>
    <button id="bShareClose" class="linkBtn" type="button">閉じる</button>
  </div>
</section>

<div id="probe"></div>
<noscript>このゲームを遊ぶには JavaScript を有効にしてください。</noscript>

<script>
(() => {
'use strict';

/* ================= 基本ユーティリティ ================= */
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const mod = (a, n) => ((a % n) + n) % n;
const rand = (a, b) => a + Math.random() * (b - a);
const wd = (d, n) => d > n / 2 ? d - n : d < -n / 2 ? d + n : d;   // ワープ込みの最短差分
const easeOutBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const fmt = n => Math.round(n).toLocaleString('en-US');

// GitHub Pages では localStorage に保存。使えない環境ではメモリだけで動く
const store = {
  get(k, d) { try { const v = localStorage.getItem('dopasnake.' + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('dopasnake.' + k, String(v)); } catch (e) { /* 保存できなくても続行 */ } }
};

const cv = $('game'), ctx = cv.getContext('2d');
const hudEl = $('hud'), scoreEl = $('score'), bestEl = $('best'), lvEl = $('lvChip');
const gaugeFill = $('gaugeFill'), gaugeLbl = $('gaugeLbl');
const titleEl = $('title'), pauseEl = $('pause'), resultEl = $('result'), shareEl = $('share'), calloutBox = $('callouts');
const FNUM = '"Chakra Petch","Avenir Next Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif';

const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let fxSoft = store.get('fx', reduceMotion ? 'soft' : 'full') === 'soft';
let FXK = fxSoft ? 0.3 : 1;

/* ================= 調整用の定数 ================= */
const FEVER_LEN = 8;          // フィーバーの秒数
const FOOD_HUES = [320, 185, 60, 110, 22, 268];
const COMBO_WORDS = { 5: 'ナイス!', 10: 'イイね!!', 15: 'すごい!!', 20: 'ヤバい!!!', 30: '激アツ!!!', 40: '神!!!!', 50: '限界突破!!!!', 75: '脳汁ドバドバ', 100: '伝説' };
const RANKS = [
  { min: 6000000, k: '神', m: '伝説のヘビ', h: 48 },
  { min: 2500000, k: 'SSS', m: '脳汁ドバドバ', h: 320 },
  { min: 1000000, k: 'SS', m: 'バケモン級', h: 290 },
  { min: 400000, k: 'S', m: 'すごすぎ!', h: 48 },
  { min: 120000, k: 'A', m: 'うまい!', h: 110 },
  { min: 30000, k: 'B', m: 'いい感じ', h: 185 },
  { min: 0, k: 'C', m: 'まだ準備運動', h: 220 }
];

/* ================= 状態 ================= */
let W = 0, H = 0, DPR = 1, cell = 24, cols = 15, rows = 22, bx = 0, by = 0, bw = 0, bh = 0;
const OT = { x: 60, y: 40 };          // 得点オーブの飛び先(スコア表示)
const S = {
  mode: 'play', demo: true,
  snake: [], dir: { x: 1, y: 0 }, lastDir: { x: 1, y: 0 }, queue: [], grow: 0, prevTail: null, foods: [],
  score: 0, shown: 0, shownTxt: -1, best: Number(store.get('best', 0)) || 0, beaten: false,
  combo: 0, comboT: 0, comboMax: 4.5, maxCombo: 0, gauge: 0, gaugeShown: -1, feverT: 0, magnetT: 0,
  level: 1, eaten: 0, finalLen: 0,
  tickT: 0, time: 0, hitstop: 0, shake: 0, flash: 0, flashHue: 0, beat: 0, beatClock: 0,
  comboPop: 0, eatPulse: 0, wordHold: 0, hue: 190, hueT: 190, bulges: [], trailT: 0,
  resT: 0, resDone: false, resShown: -1, isRecord: false, rank: RANKS[RANKS.length - 1], lastTick: 0, lastPop: 0
};
const P = [];    // パーティクル
const RG = [];   // リング
const RP = [];   // 盤面の波紋
const FT = [];   // 浮かぶ文字
const Q = [];    // 遅延実行
const beatQ = [];
const stars = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), z: rand(0.2, 1) }));

const cx = x => bx + (x + 0.5) * cell;
const cy = y => by + (y + 0.5) * cell;
const later = (d, f) => Q.push({ t: S.time + d, f });
const tickLen = () => {
  if (S.demo) return 105;
  const base = Math.max(62, 130 - (S.level - 1) * 6);
  return S.feverT > 0 ? base * 0.85 : base;
};
const bpm = () => 112 + Math.min(S.level - 1, 12) * 3 + (S.feverT > 0 ? 14 : 0);

/* ================= レイアウト ================= */
const boardCv = document.createElement('canvas');

function layout(recalc) {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const top = hudEl.getBoundingClientRect().bottom + 12;
  const pad = 10, bot = 10 + ($('probe').offsetHeight || 0);
  const aw = Math.max(120, W - pad * 2), ah = Math.max(120, H - top - bot);

  if (f.type === 'n') {

    if (r < 0.09) { if (!hasFood('gold')) spawn('gold'); }
    else if (r < 0.14) { if (!hasFood('magnet') && S.magnetT <= 0) spawn('magnet'); }
    else if (r < 0.21) { if (len >= 16 && !hasFood('cut')) spawn('cut'); }
  }
  if ((f.type === 'n' || f.type === 'gold') && S.eaten % 10 === 0) levelUp();
  if (!fever && S.gauge >= 1) startFever();
  refill();
  if (!demo) {
    const word = COMBO_WORDS[c] || (c > 100 && c % 50 === 0 ? c + ' COMBO!!' : null);
    if (word && S.time >= S.wordHold) { callout(word, FOOD_HUES[c % FOOD_HUES.length]); sfxWord(); flash(0.14, f.hue); }
    if (!S.beaten && S.best > 0 && S.score > S.best) { S.beaten = true; callout('自己ベスト更新!', 48, 'low'); sfxLevel(); }
  }
  hudSync();
}

function cutTail(f, x, y, c, mult) {
  const n = S.snake.length, keep = Math.max(4, Math.ceil(n / 2));
  const cut = S.snake.splice(keep);
  S.prevTail = null; S.grow = 0;
  cut.forEach((s, j) => later(j * 0.02, () => {
    burst(cx(s.x), cy(s.y), 175 + j * 9, 7, 180);
    if (S.mode === 'play' && !S.demo) { S.score += 50 * c * mult; if (!(j & 1)) sfxTick(600 + j * 30); }
  }));
  burst(x, y, 175, 30, 340); ring(x, y, 175, cell * 5, 0.6); ripple(f.x, f.y, 175, 1.2);
  shake(10); flash(0.18, 175); sfxCut(); vib(20);
  floatText('TAIL CUT!', x, y - cell * 1.6, 22, 175);
}

function levelUp() {
  S.level++; S.hueT += 47;
  ring(bx + bw / 2, by + bh / 2, S.hueT, Math.max(bw, bh) * 0.8, 0.8);
  ripple(cols / 2, rows / 2, S.hueT, 1.2);
  if (!S.demo) { callout('LEVEL UP!', mod(S.hueT, 360), 'low'); sfxLevel(); flash(0.18, mod(S.hueT, 360)); }
}

function startFever() {
  S.feverT = FEVER_LEN; S.gauge = 1;
  const h = S.snake[0], x = cx(h.x), y = cy(h.y);
  ring(x, y, 300, Math.max(bw, bh), 0.9); ring(x, y, 50, Math.max(bw, bh) * 0.6, 0.7);
  ripple(h.x, h.y, 300, 1.5);
  burst(x, y, 0, 70, 560, { spread: 360, size: 4, life: 0.8 });
  if (!S.demo) {
    document.body.classList.add('fever'); gaugeLbl.textContent = 'FEVER ×3';
    callout('フィーバー!!', 320); S.wordHold = S.time + 1; sfxFever(); flash(0.4, 300); shake(16); S.hitstop = 0.12; vib([30, 40, 60]);
  }
}
function endFever() {
  S.feverT = 0; S.gauge = 0; S.comboT = S.comboMax;
  document.body.classList.remove('fever'); gaugeLbl.textContent = 'FEVER';
  sfxFeverEnd();
}
function comboLost() {
  if (S.combo >= 5 && !S.demo) { floatText('COMBO ' + S.combo + ' 終了', bx + bw / 2, by + cell * 2.2, 18, 0); sfxLost(); }
  S.combo = 0;
}

function die() {
  const demo = S.demo, h = S.snake[0], x = cx(h.x), y = cy(h.y), n = S.snake.length;
  if (!demo) captureScreen();   // 爆発する前の最後の画面をシェア画像の背景用に残す
  S.mode = 'dying'; S.hitstop = 0; S.prevTail = null; S.finalLen = n; S.queue.length = 0;
  S.feverT = 0; S.magnetT = 0; S.gauge = 0;
  document.body.classList.remove('fever'); gaugeLbl.textContent = 'FEVER';
  burst(x, y, 0, 44, 440, { size: 4 }); ring(x, y, 0, cell * 6, 0.6);
  if (!demo) { shake(24); flash(0.45, 0); sfxDie(); musicStop(); vib([60, 40, 120]); }
  const gap = Math.min(0.035, 1 / n);
  for (let i = 0; i < n; i++) later(0.35 + i * gap, () => {
    const s = S.snake.shift(); if (!s) return;
    burst(cx(s.x), cy(s.y), S.hue + i * 12, 9, 240);
    if (!demo) { if (i % 3 === 0) sfxTick(900 - (i / n) * 600); S.shake = Math.max(S.shake, 4); }
  });
  later(0.35 + n * gap + 0.55, () => { if (demo) newGame(true); else showResult(); });
}

function showResult() {
  S.mode = 'over'; S.resT = 0; S.resDone = false; S.resShown = -1; S.combo = 0;
  S.isRecord = S.score > S.best;
  if (S.isRecord) { S.best = S.score; store.set('best', S.best); }
  S.rank = RANKS.find(r => S.score >= r.min) || RANKS[RANKS.length - 1];
  const rk = $('rRank');
  rk.textContent = S.rank.k; rk.className = 'rank' + (S.rank.k.length > 1 ? ' l' + S.rank.k.length : '');   // SS・SSS は画面幅に収まる大きさに
  rk.style.setProperty('--rc', 'hsl(' + S.rank.h + ' 100% 62%)');
  $('rMsg').textContent = S.rank.m;
  $('rCombo').textContent = S.maxCombo; $('rLen').textContent = S.finalLen; $('rLv').textContent = S.level;
  $('rScore').textContent = '0';
  resultEl.classList.remove('done', 'rec');
  resultEl.classList.add('show');
  hudSync();
  prepareCard();   // 共有メニューはタップ直後に呼ぶ必要があるので、画像は先に作っておく
}

/* ================= 更新 ================= */
function update(dt) {
  S.time += dt;
  if (Q.length) {
    const due = [];
    for (let i = Q.length - 1; i >= 0; i--) if (Q[i].t <= S.time) { due.push(Q[i]); Q.splice(i, 1); }
    due.sort((a, b) => a.t - b.t);
    for (const e of due) e.f();
  }
  let gdt = dt, pdt = dt;
  if (S.hitstop > 0) { S.hitstop -= dt; gdt = 0; pdt = dt * 0.15; }

  if (S.mode === 'play') {
    S.tickT += gdt * 1000;
    let guard = 0;
    while (S.mode === 'play' && S.tickT >= tickLen() && guard++ < 4) { S.tickT -= tickLen(); step(); }
  }
  if (S.mode === 'play') {
    if (S.feverT > 0) {
      const before = Math.ceil(S.feverT * 2);
      S.feverT -= gdt;
      if (S.feverT <= 0) endFever();
      else if (S.feverT < 1.6 && Math.ceil(S.feverT * 2) !== before) sfxTick(1400);
    } else if (S.combo > 0) {
      S.comboT -= gdt;
      if (S.comboT <= 0) comboLost();
    }
    if (S.magnetT > 0) S.magnetT -= gdt;
    for (let i = S.foods.length - 1; i >= 0; i--) {
      const f = S.foods[i];
      if (f.ttl === Infinity) continue;
      f.ttl -= gdt;
      if (f.type === 'gold' && Math.random() < dt * 9) burst(cx(f.x), cy(f.y), 48, 1, 90, { size: 2, life: 0.5 });
      if (f.ttl <= 0) { burst(cx(f.x), cy(f.y), f.hue, 8, 120); S.foods.splice(i, 1); }
    }
    // コンボ中は頭から火花
    if ((S.combo >= 10 || S.feverT > 0) && S.snake.length) {
      S.trailT -= dt;
      if (S.trailT <= 0) {
        S.trailT = S.feverT > 0 ? 0.016 : 0.04;
        const h = S.snake[0];
        burst(cx(h.x), cy(h.y), S.feverT > 0 ? S.time * 400 : S.hue + 60, 1, 110, { size: 2.6, life: 0.45, spread: 60 });
      }
    }
    // ビート
    if (AU.ctx && AU.playing && AU.ctx.state === 'running') {
      while (beatQ.length && beatQ[0] <= AU.ctx.currentTime) { beatQ.shift(); S.beat = 1; }
    } else {
      S.beatClock += dt * bpm() / 60;
      if (S.beatClock >= 1) { S.beatClock -= 1; S.beat = 1; }
    }
  }

  if (S.mode === 'over') {
    S.resT += dt;
    const p = clamp((S.resT - 0.2) / 1.1, 0, 1), v = Math.round(S.score * (1 - Math.pow(1 - p, 3)));
    if (v !== S.resShown) {
      S.resShown = v; $('rScore').textContent = fmt(v);
      if (S.time - S.lastTick > 0.05) { S.lastTick = S.time; sfxTick(500 + p * 900); }
    }
    if (p >= 1 && !S.resDone) {
      S.resDone = true; resultEl.classList.add('done');
      S.shake = 14; sfxThud(); S.flash = 0.22; S.flashHue = S.rank.h; vib(40);
      if (S.isRecord) { resultEl.classList.add('rec'); confetti(); sfxFanfare(); }
    }
  }

  // 減衰もの
  S.shake *= Math.exp(-dt * 9);
  S.flash = Math.max(0, S.flash - dt * 2.4);
  S.beat *= Math.exp(-dt * 7);
  S.comboPop *= Math.exp(-dt * 8);
  S.eatPulse *= Math.exp(-dt * 10);
  S.hue += (S.hueT - S.hue) * Math.min(1, dt * 3);
  for (let i = S.bulges.length - 1; i >= 0; i--) if (S.bulges[i] > S.snake.length + 2) S.bulges.splice(i, 1);

  const sp = (S.feverT > 0 ? 0.9 : 0.1) * dt;
  for (const s of stars) { s.x = mod(s.x - S.lastDir.x * sp * s.z, 1); s.y = mod(s.y - S.lastDir.y * sp * s.z, 1); }

  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i]; p.t += pdt;
    let dead = p.t >= p.life;
    if (!dead && p.type === 1) {
      if (p.t > 0.14) {
        const ddx = OT.x - p.x, ddy = OT.y - p.y, d = Math.hypot(ddx, ddy) || 1;
        if (d < 26) { dead = true; scorePop(); }
        else { const k = Math.min(1, pdt * 9), v = 900 + p.t * 1400; p.vx += (ddx / d * v - p.vx) * k; p.vy += (ddy / d * v - p.vy) * k; }
      } else { const k = Math.exp(-pdt * 4); p.vx *= k; p.vy *= k; }
    } else if (!dead) {
      const k = Math.exp(-pdt * p.drag); p.vx *= k; p.vy *= k; p.vy += p.g * pdt; p.rot += p.vr * pdt;
    }
    if (dead) { P[i] = P[P.length - 1]; P.pop(); continue; }
    p.x += p.vx * pdt; p.y += p.vy * pdt;
  }
  for (let i = RG.length - 1; i >= 0; i--) { RG[i].t += pdt; if (RG[i].t >= RG[i].life) RG.splice(i, 1); }
  for (let i = RP.length - 1; i >= 0; i--) if (S.time - RP[i].t0 >= RP[i].life) RP.splice(i, 1);
  for (let i = FT.length - 1; i >= 0; i--) { const f = FT[i]; f.t += dt; f.y -= 42 * dt; if (f.t >= f.life) FT.splice(i, 1); }

  // HUD
  if (!S.demo) {
    S.shown += (S.score - S.shown) * Math.min(1, dt * 14);
    if (S.score - S.shown < 1) S.shown = S.score;
    const txt = Math.round(S.shown);
    if (txt !== S.shownTxt) { S.shownTxt = txt; scoreEl.textContent = fmt(txt); }
  }
  const g = S.demo ? 0 : S.feverT > 0 ? S.feverT / FEVER_LEN : S.gauge;
  if (Math.abs(g - S.gaugeShown) > 0.004) { S.gaugeShown = g; gaugeFill.style.transform = 'scaleX(' + g.toFixed(3) + ')'; }
}

/* ================= 描画 ================= */
const HSL = [];
const hsl = h => { h = mod(Math.round(h), 360); return HSL[h] || (HSL[h] = 'hsl(' + h + ',100%,64%)'); };
const glowCache = {};
function glowSprite(h) {
  h = (Math.round(mod(h, 360) / 12) * 12) % 360;
  let c = glowCache[h];
  if (!c) {
    c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'hsla(' + h + ',100%,88%,1)');
    gr.addColorStop(0.22, 'hsla(' + h + ',100%,62%,.6)');
    gr.addColorStop(1, 'hsla(' + h + ',100%,50%,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    glowCache[h] = c;
  }
  return c;
}
function drawGlow(x, y, r, h, a) { ctx.globalAlpha = a; ctx.drawImage(glowSprite(h), x - r, y - r, r * 2, r * 2); }
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function render() {
  const t = S.mode === 'play' ? clamp(S.tickT / tickLen(), 0, 1) : 1;
  const fever = S.feverT > 0;
  const hue = fever ? mod(S.time * 140, 360) : mod(S.hue, 360);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = 'hsl(' + hue.toFixed(0) + ',70%,' + (3 + S.beat * 1.6 * FXK).toFixed(1) + '%)';
  ctx.fillRect(0, 0, W, H);
  const mx = bx + bw / 2, my = by + bh / 2;
  const bg = ctx.createRadialGradient(mx, my, 0, mx, my, Math.max(W, H) * 0.75);
  bg.addColorStop(0, 'hsla(' + hue.toFixed(0) + ',90%,50%,' + (0.17 + S.beat * 0.07 * FXK + (fever ? 0.12 : 0)).toFixed(3) + ')');
  bg.addColorStop(1, 'hsla(0,0%,0%,0)');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // 星
  ctx.fillStyle = '#fff';
  const d = S.lastDir, stretch = fever ? 34 : 0;
  for (const s of stars) {
    ctx.globalAlpha = s.z * (fever ? 0.75 : 0.45);
    const sz = 1 + s.z * 1.6;
    ctx.fillRect(s.x * W, s.y * H, sz + Math.abs(d.x) * stretch * s.z, sz + Math.abs(d.y) * stretch * s.z);
  }
  ctx.globalAlpha = 1;

  const sh = S.shake * FXK;
  ctx.save();
  ctx.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);

  // 盤面
  const rad = cell * 0.55;
  ctx.save();
  rr(bx, by, bw, bh, rad); ctx.clip();
  ctx.drawImage(boardCv, bx, by, bw, bh);
  drawRipples();
  drawCombo(hue);
  drawFoods(t);
  drawSnake(t, hue);
  ctx.restore();

  // 枠
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = hsl(hue);
  rr(bx, by, bw, bh, rad);
  ctx.globalAlpha = 0.1 + S.beat * 0.1; ctx.lineWidth = 14 + S.beat * 8; ctx.stroke();
  ctx.globalAlpha = 0.3; ctx.lineWidth = 6; ctx.stroke();
  ctx.globalAlpha = 1; ctx.lineWidth = 2; ctx.stroke();

  drawRings();
  drawParticles();
  drawTexts();
  ctx.restore();

  ctx.globalCompositeOperation = 'lighter';
  if (fever) {
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.72);
    vg.addColorStop(0, 'hsla(0,0%,0%,0)');
    vg.addColorStop(1, 'hsla(' + hue.toFixed(0) + ',100%,55%,' + ((0.22 + S.beat * 0.2) * (fxSoft ? 0.5 : 1)).toFixed(3) + ')');
    ctx.globalAlpha = 1; ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
  if (S.flash > 0) {
    ctx.globalAlpha = Math.min(0.5, S.flash * FXK);
    ctx.fillStyle = 'hsl(' + mod(Math.round(S.flashHue), 360) + ',100%,75%)';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

function drawRipples() {
  if (!RP.length) return;
  ctx.globalCompositeOperation = 'lighter';
  for (const r of RP) {
    const age = S.time - r.t0, radius = age * 16, fade = 1 - age / r.life;
    if (fade <= 0) continue;
    ctx.fillStyle = hsl(r.hue);
    const x0 = Math.max(0, Math.floor(r.x - radius - 2)), x1 = Math.min(cols - 1, Math.ceil(r.x + radius + 2));
    const y0 = Math.max(0, Math.floor(r.y - radius - 2)), y1 = Math.min(rows - 1, Math.ceil(r.y + radius + 2));
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const dd = Math.abs(Math.hypot(x - r.x, y - r.y) - radius);
      if (dd > 1.6) continue;
      ctx.globalAlpha = (1 - dd / 1.6) * fade * r.s * 0.45;
      ctx.fillRect(bx + x * cell + 1, by + y * cell + 1, cell - 2, cell - 2);
    }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

function drawCombo(hue) {
  if (S.demo) return;
  const fever = S.feverT > 0;
  if (S.combo >= 2) {
    const size = Math.min(bw * 0.5, bh * 0.3) * (1 + S.comboPop * 0.22);
    ctx.globalCompositeOperation = 'lighter';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = hsl(hue + 40);
    ctx.globalAlpha = 0.13 + S.comboPop * 0.25;
    ctx.font = 'italic 700 ' + size.toFixed(0) + 'px ' + FNUM;
    ctx.fillText(String(S.combo), bx + bw / 2, by + bh * 0.46);
    ctx.font = 'italic 700 ' + (size * 0.2).toFixed(0) + 'px ' + FNUM;
    ctx.fillText('COMBO', bx + bw / 2, by + bh * 0.46 + size * 0.62);
    ctx.globalCompositeOperation = 'source-over';
  }
  // コンボの残り時間
  if (S.combo > 0 || fever) {
    const k = fever ? 1 : clamp(S.comboT / S.comboMax, 0, 1);
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = fever ? hsl(S.time * 500) : k < 0.3 ? '#ff3b4f' : hsl(hue);
    ctx.fillRect(bx, by, bw * k, 5);
  }
  ctx.globalAlpha = 1;
}

const BOLT = [0.15, -0.9, -0.5, 0.1, -0.05, 0.1, -0.2, 0.9, 0.5, -0.15, 0.05, -0.15];
function drawFoods(t) {
  const beat = 1 + S.beat * 0.16;
  for (const f of S.foods) {
    const x = bx + (f.x - f.dx * (1 - t) + 0.5) * cell, y = by + (f.y - f.dy * (1 - t) + 0.5) * cell;
    const a = clamp((S.time - f.born) / 0.3, 0, 1);
    const sc = easeOutBack(a) * (1 + 0.1 * Math.sin(S.time * 6 + f.x * 1.7 + f.y)) * beat;
    const blink = f.ttl < 2.5 ? 0.45 + 0.55 * Math.abs(Math.sin(S.time * 12)) : 1;
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(x, y, cell * (f.type === 'n' ? 1.25 : 1.9) * sc, f.hue, 0.9 * blink);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = blink;
    if (f.type === 'n') {
      const r = cell * 0.3 * sc;
      ctx.fillStyle = 'hsl(' + f.hue + ',100%,68%)';
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.36, 0, TAU); ctx.fill();
    } else if (f.type === 'gold') {
      const ro = cell * 0.52 * sc, rot = S.time * 2.4;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) { const an = rot + i * Math.PI / 5, r = i & 1 ? ro * 0.46 : ro; ctx.lineTo(x + Math.cos(an) * r, y + Math.sin(an) * r); }
      ctx.closePath();
      ctx.fillStyle = '#ffe14a'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
    } else if (f.type === 'magnet') {
      const r = cell * 0.24 * sc, lw = cell * 0.2 * sc;
      ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(S.time * 5) * 0.3);
      ctx.lineCap = 'butt'; ctx.lineWidth = lw; ctx.strokeStyle = '#ff3b5c';
      ctx.beginPath(); ctx.moveTo(-r, cell * 0.14); ctx.lineTo(-r, -cell * 0.04); ctx.arc(0, -cell * 0.04, r, Math.PI, 0); ctx.lineTo(r, cell * 0.14); ctx.stroke();
      ctx.strokeStyle = '#fff';
      ctx.beginPath(); ctx.moveTo(-r, cell * 0.14); ctx.lineTo(-r, cell * 0.3); ctx.moveTo(r, cell * 0.14); ctx.lineTo(r, cell * 0.3); ctx.stroke();
      ctx.restore();
    } else {
      const r = cell * 0.56 * sc;
      ctx.beginPath();
      for (let i = 0; i < 12; i += 2) ctx.lineTo(x + BOLT[i] * r, y + BOLT[i + 1] * r);
      ctx.closePath();
      ctx.fillStyle = '#b8fff6'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#21f3ff'; ctx.stroke();
    }
    if (f.ttl !== Infinity) {
      ctx.globalAlpha = 0.75; ctx.lineWidth = 2.5; ctx.strokeStyle = '#fff'; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(x, y, cell * 0.68, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(f.ttl / f.ttl0, 0, 1)); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

const PTS = [];
function drawSnake(t, hue) {
  const s = S.snake, n = s.length;
  if (!n) return;
  const fever = S.feverT > 0, d = S.lastDir, h = s[0];
  // ワープをまたいでも線がつながるよう、連続した座標に展開する
  PTS.length = 0;
  PTS.push(h.x - d.x * (1 - t), h.y - d.y * (1 - t));
  let ux = h.x, uy = h.y;
  for (let i = 1; i < n; i++) { ux += wd(s[i].x - s[i - 1].x, cols); uy += wd(s[i].y - s[i - 1].y, rows); PTS.push(ux, uy); }
  if (S.prevTail && n > 1 && t < 1) {
    const l = s[n - 1];
    PTS.push(ux + wd(S.prevTail.x - l.x, cols) * (1 - t), uy + wd(S.prevTail.y - l.y, rows) * (1 - t));
  }
  const m = PTS.length / 2;
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (let i = 0; i < m; i++) {
    const X = PTS[i * 2], Y = PTS[i * 2 + 1];
    if (X < minX) minX = X; if (X > maxX) maxX = X; if (Y < minY) minY = Y; if (Y > maxY) maxY = Y;
  }
  const alpha = fever && S.feverT < 2 && Math.floor(S.time * 10) % 2 ? 0.45 : 1;   // フィーバー終了間際は点滅
  const R = S.magnetT > 0 ? 5 : fever ? 3 : 0;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  for (let ky = Math.floor((minY - 1) / rows); ky <= Math.floor((maxY + 1) / rows); ky++)
  for (let kx = Math.floor((minX - 1) / cols); kx <= Math.floor((maxX + 1) / cols); kx++) {
    const ox = bx + (0.5 - kx * cols) * cell, oy = by + (0.5 - ky * rows) * cell;
    const vis = i => {
      const X = PTS[i * 2] - kx * cols, Y = PTS[i * 2 + 1] - ky * rows;
      return X > -1.5 && X < cols + 0.5 && Y > -1.5 && Y < rows + 0.5;
    };
    // 表示範囲に入っている区間だけを1本のパスにまとめる
    let any = false, pen = false;
    ctx.beginPath();
    for (let i = 0; i < m - 1; i++) {
      if (vis(i) || vis(i + 1)) {
        if (!pen) ctx.moveTo(ox + PTS[i * 2] * cell, oy + PTS[i * 2 + 1] * cell);
        ctx.lineTo(ox + PTS[i * 2 + 2] * cell, oy + PTS[i * 2 + 3] * cell);
        pen = true; any = true;
      } else pen = false;
    }
    const headVis = vis(0);
    if (!any && !headVis) continue;
    const hx = ox + PTS[0] * cell, hy = oy + PTS[1] * cell;

    if (any) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = hsl(fever ? S.time * 300 : hue + 30);
      ctx.globalAlpha = 0.1 * alpha; ctx.lineWidth = cell * (2.1 + S.beat * 0.4); ctx.stroke();
      ctx.globalAlpha = 0.16 * alpha; ctx.lineWidth = cell * 1.35; ctx.stroke();
      // 本体。しっぽ側から重ねて頭を最前面に
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = alpha;
      for (let i = m - 2; i >= 0; i--) {
        if (!(vis(i) || vis(i + 1))) continue;
        const k = m - 2 - i;
        let w = 0.8 * (k < 5 ? 0.56 + 0.088 * k : 1);
        for (let b = 0; b < S.bulges.length; b++) { const q = i - S.bulges[b]; if (q > -3 && q < 3) w *= 1 + 0.5 * Math.exp(-q * q / 1.2); }
        const hi = fever ? S.time * 420 - i * 17 : hue + Math.min(i * 5, 110);
        const li = 58 + 13 * Math.sin(i * 0.7 - S.time * 11);
        ctx.strokeStyle = 'hsl(' + mod(Math.round(hi), 360) + ',100%,' + li.toFixed(0) + '%)';
        ctx.lineWidth = cell * w;
        ctx.beginPath();
        ctx.moveTo(ox + PTS[i * 2] * cell, oy + PTS[i * 2 + 1] * cell);
        ctx.lineTo(ox + PTS[i * 2 + 2] * cell, oy + PTS[i * 2 + 3] * cell);
        ctx.stroke();
      }
    }
    if (!headVis) continue;
    // 頭
    const hr = cell * 0.5 * (1 + S.eatPulse * 0.3);
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(hx, hy, cell * (1.9 + S.eatPulse), fever ? S.time * 300 : hue, 0.8 * alpha);
    if (R) {
      ctx.globalAlpha = 0.3; ctx.strokeStyle = hsl(S.magnetT > 0 ? 350 : S.time * 300); ctx.lineWidth = 2;
      ctx.setLineDash([6, 9]); ctx.lineDashOffset = -S.time * 50;
      ctx.beginPath(); ctx.arc(hx, hy, R * cell * (0.92 + 0.08 * Math.sin(S.time * 9)), 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = alpha;
    ctx.fillStyle = 'hsl(' + mod(Math.round(fever ? S.time * 420 : hue), 360) + ',100%,78%)';
    ctx.beginPath(); ctx.arc(hx, hy, hr, 0, TAU); ctx.fill();
    const px = -d.y, py = d.x, er = cell * 0.13;
    for (const sgn of [-1, 1]) {
      const ex = hx + d.x * cell * 0.14 + px * sgn * cell * 0.2, ey = hy + d.y * cell * 0.14 + py * sgn * cell * 0.2;
      ctx.fillStyle = '#12061f'; ctx.beginPath(); ctx.arc(ex, ey, er, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex + d.x * er * 0.4 - er * 0.2, ey + d.y * er * 0.4 - er * 0.25, er * 0.4, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

function drawRings() {
  ctx.globalCompositeOperation = 'lighter';
  for (const r of RG) {
    const p = r.t / r.life, rad = r.r1 * (1 - Math.pow(1 - p, 3));
    ctx.globalAlpha = 1 - p; ctx.strokeStyle = hsl(r.hue); ctx.lineWidth = cell * 0.3 * (1 - p) + 1;
    ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawParticles() {
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const p of P) {
    if (p.type === 2) continue;
    const a = 1 - p.t / p.life;
    if (p.type === 0) {
      ctx.globalAlpha = a; ctx.strokeStyle = hsl(p.hue); ctx.lineWidth = p.size * (0.4 + a * 0.6);
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035); ctx.stroke();
    } else {
      drawGlow(p.x, p.y, p.size * 3.4, p.hue, 1);
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  for (const p of P) {
    if (p.type !== 2) continue;
    ctx.globalAlpha = Math.min(1, (1 - p.t / p.life) * 3);
    ctx.fillStyle = hsl(p.hue);
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillRect(-p.size, -p.size * 0.5, p.size * 2, p.size);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawTexts() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const f of FT) {
    const p = f.t / f.life, sc = p < 0.18 ? easeOutBack(p / 0.18) : 1;
    ctx.globalAlpha = p > 0.7 ? 1 - (p - 0.7) / 0.3 : 1;
    const size = Math.max(1, f.size * sc);
    ctx.font = 'italic 700 ' + size.toFixed(1) + 'px ' + FNUM;
    ctx.lineWidth = size * 0.24; ctx.strokeStyle = 'rgba(10,0,25,.9)';
    ctx.strokeText(f.txt, f.x, f.y);
    ctx.fillStyle = 'hsl(' + mod(Math.round(f.hue), 360) + ',100%,74%)';
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

const SITE_URL = 'https://chocomin-wk.github.io/dopa-snake/';

// いま画面に出ているゲーム画面をまるごと残す(直前に描いたフレーム=ヘビが残っている最後の姿)
function captureScreen() {
  try {
    const k = Math.min(1, 1600 / Math.max(cv.width, cv.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(cv.width * k)); c.height = Math.max(1, Math.round(cv.height * k));
    c.getContext('2d').drawImage(cv, 0, 0, c.width, c.height);

}

function shareBody() {

// リザルト画面のキャプチャを作る。
// 背景=最後のゲーム画面、その上にリザルトの各要素を実際の表示位置・サイズで描き直す。
// ボタンがあった場所にはゲーム名とURLを入れる。
async function drawCard(d) {
  const scoreTxt = fmt(d.score);
  try {
    if (document.fonts && document.fonts.load) await Promise.race([
      Promise.all([
        document.fonts.load('400 100px "Dela Gothic One"', 'DOPASNAKE自己ベスト更新!!' + d.rank.k + d.rank.m),
        document.fonts.load('italic 700 100px "Chakra Petch"', scoreTxt + '0123456789.')
      ]),
      new Promise(r => setTimeout(r, 1500))
    ]);
  } catch (e) { /* 代替フォントで描く */ }
  const vw = d.w, vh = d.h, k = Math.min(2, 1600 / Math.max(vw, vh));
  const c = document.createElement('canvas');
  c.width = Math.round(vw * k); c.height = Math.round(vh * k);
  const g = c.getContext('2d'), h = d.rank.h, u = Math.min(vw, vh);
  g.setTransform(k, 0, 0, k, 0, 0);

  // 背景: 最後のゲーム画面
  g.fillStyle = '#06030d'; g.fillRect(0, 0, vw, vh);
  if (d.shot) {
    const sc = Math.max(vw / d.shot.width, vh / d.shot.height), dw = d.shot.width * sc, dh = d.shot.height * sc;
    g.imageSmoothingQuality = 'high';
    g.drawImage(d.shot, (vw - dw) / 2, (vh - dh) / 2, dw, dh);
  }
  // リザルト画面と同じ暗幕
  g.save(); g.translate(vw / 2, vh / 2); g.scale(vw * 0.71, vh * 0.71);
  const dim = g.createRadialGradient(0, 0, 0, 0, 0, 1);
  dim.addColorStop(0, 'rgba(6,3,13,.4)'); dim.addColorStop(1, 'rgba(6,3,13,.86)');
  g.fillStyle = dim; g.fillRect(-1.5, -1.5, 3, 3); g.restore();
  const gl = g.createRadialGradient(vw / 2, vh * 0.36, 0, vw / 2, vh * 0.36, u * 0.7);
  gl.addColorStop(0, 'hsla(' + h + ',100%,55%,.22)'); gl.addColorStop(1, 'hsla(' + h + ',100%,50%,0)');
  g.fillStyle = gl; g.fillRect(0, 0, vw, vh);

  // 画面上の実際の位置と文字サイズを読む。読めないときは比率で置く
  const at = (node, fy, fsize) => {
    let r = null, fs = 0;
    try { r = node.getBoundingClientRect(); fs = parseFloat(getComputedStyle(node).fontSize) || 0; } catch (e) { r = null; }
    if (r && r.width > 0 && r.height > 0 && fs > 0) return { x: r.left + r.width / 2, y: r.top + r.height / 2, size: fs };
    return { x: vw / 2, y: vh * fy, size: fsize };
  };
  const text = (txt, p, font, fill, o) => {
    o = o || {};
    let size = p.size;
    g.font = font.replace('#', size);
    const w = g.measureText(txt).width, maxW = vw * 0.92;
    if (w > maxW) { size = size * maxW / w; g.font = font.replace('#', size); }
    g.save(); g.translate(p.x, p.y); if (o.rot) g.rotate(o.rot);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    if (o.off) { g.fillStyle = o.off; g.fillText(txt, size * (o.offK || 0.06), size * (o.offK || 0.06)); }
    if (o.glow) { g.shadowColor = o.glow; g.shadowBlur = o.blur || 24; }
    g.fillStyle = fill; g.fillText(txt, 0, 0);
    g.restore();
    return size;
  };
  const q = sel => resultEl.querySelector(sel);

  if (d.record) text('自己ベスト更新!!', at(q('.newrec'), 0.2, u * 0.055), '400 #px ' + FDISP, '#f6ff3a', { rot: -0.07, off: '#ff2bd6', offK: 0.07 });
  const rc = 'hsl(' + h + ',100%,62%)';
  text(d.rank.k, at($('rRank'), 0.33, u * 0.34), '400 #px ' + FDISP, rc, { rot: -0.105, off: '#fff', offK: 0.045, glow: rc, blur: 60 });
  text(d.rank.m, at($('rMsg'), 0.47, u * 0.046), '400 #px ' + FDISP, '#fff');
  text(scoreTxt, at($('rScore'), 0.56, u * 0.15), 'italic 700 #px "Chakra Petch",' + FUI, '#fff', { glow: 'rgba(33,243,255,.85)', blur: 22 });
  const cells = resultEl.querySelectorAll('.stats > div');
  [['最大コンボ', d.combo], ['長さ', d.len], ['レベル', d.lv]].forEach(([lb, v], i) => {
    const cell = cells[i], dt = cell && cell.querySelector('dt'), dd = cell && cell.querySelector('dd');
    const fx = vw / 2 + (i - 1) * u * 0.24;
    const pl = at(dt, 0.655, 11), pv = at(dd, 0.69, 24);
    if (!dt) { pl.x = fx; pv.x = fx; }
    text(lb, pl, '700 #px ' + FUI, '#a99dc8');
    text(String(v), pv, 'italic 700 #px "Chakra Petch",' + FUI, '#fff');
  });

  // ボタンの位置にゲーム名とURL
  const pb = at($('bRetry'), 0.8, 0), pu = at($('bShare'), 0.87, 0);
  const ls = clamp(u * 0.085, 26, 46);
  g.font = '400 ' + ls + 'px ' + FDISP; g.textAlign = 'left'; g.textBaseline = 'middle';
  const w1 = g.measureText('DOPA ').width, w2 = g.measureText('SNAKE').width, lx = pb.x - (w1 + w2) / 2;
  g.save(); g.translate(0, pb.y);
  g.fillStyle = '#ff2bd6'; g.fillText('DOPA ', lx + ls * 0.06, ls * 0.06); g.fillStyle = '#f6ff3a'; g.fillText('DOPA ', lx, 0);
  g.fillStyle = '#21f3ff'; g.fillText('SNAKE', lx + w1 + ls * 0.06, ls * 0.06); g.fillStyle = '#fff'; g.fillText('SNAKE', lx + w1, 0);
  g.restore();
  g.textAlign = 'center';
  g.fillStyle = 'rgba(246,241,255,.85)'; g.font = 'italic 700 ' + clamp(u * 0.042, 14, 20) + 'px "Chakra Petch",' + FUI;
  g.fillText(SITE_URL.replace(/^https:\/\//, '').replace(/\/$/, ''), pu.x, pu.y);

  let dataUrl = '';
  try { dataUrl = c.toDataURL('image/png'); } catch (e) { dataUrl = ''; }
  const blob = await new Promise(res => { try { c.toBlob(b => res(b), 'image/png'); } catch (e) { res(null); } });
  return { canvas: c, blob, dataUrl };
}

function prepareCard() {
  const d = { score: S.score, rank: S.rank, combo: S.maxCombo, len: S.finalLen, lv: S.level, record: S.isRecord, shot, w: W, h: H };
  const key = [d.score, d.rank.k, d.combo, d.len, d.lv, d.record, shotNo, W, H].join('|');
  if (card.key === key && card.p) return card.p;
  const mine = card = { key, canvas: null, blob: null, dataUrl: '', p: null };
  mine.p = drawCard(d).then(r => { mine.canvas = r.canvas; mine.blob = r.blob; mine.dataUrl = r.dataUrl; return r; }).catch(() => null);
  return mine.p;
}
// プレビュー表示。<img> で出せない環境では canvas をそのまま置く
function showCard() {
  const wrap = $('cardWrap'), img = $('cardImg'), wait = $('cardWait');
  const old = wrap.querySelector('canvas'); if (old) old.remove();
  if (!card.canvas) { wrap.classList.remove('ready'); wait.textContent = 'この環境では画像を作れませんでした'; return; }
  // 縦長のキャプチャでも画面に収まるよう、高さの上限から幅を決める
  const ratio = card.canvas.width / card.canvas.height, pw = wrap.parentNode.clientWidth || 320;
  wrap.style.aspectRatio = card.canvas.width + ' / ' + card.canvas.height;
  wrap.style.width = Math.round(Math.min(pw, H * 0.42 * ratio)) + 'px';
  const useCanvas = () => { img.hidden = true; const o = wrap.querySelector('canvas'); if (o) o.remove(); wrap.insertBefore(card.canvas, wait); };
  if (card.dataUrl) { img.hidden = false; img.onerror = useCanvas; img.src = card.dataUrl; }
  else useCanvas();
  wrap.classList.add('ready');
}
const cardFile = () => card.blob ? new File([card.blob], 'dopa-snake-score.png', { type: 'image/png' }) : null;
function canShareFile() {
  const f = cardFile();
  try { return !!(f && navigator.share && navigator.canShare && navigator.canShare({ files: [f] })); } catch (e) { return false; }
}
const canCopyImage = () => !!(navigator.clipboard && navigator.clipboard.write && window.ClipboardItem);
function note(t) { $('shareNote').textContent = t; }
function refreshShareUI() {
  const nb = $('bNative'), files = canShareFile();

  nb.textContent = files ? '画像つきでシェア' : '共有メニューを開く';
  note(files ? '「画像つきでシェア」なら画像が添付されます。X などのボタンは画像をコピーして開くので、貼り付けで添付できます'
    : canCopyImage() ? 'X などのボタンは画像をコピーしてから投稿画面を開きます。貼り付けると添付できます'
    : 'X などのボタンは画像を保存してから投稿画面を開きます。保存した画像を添付してください');
}
function openSharePanel() {

  $('sX').href = 'https://twitter.com/intent/tweet?text=' + enc(body) + '&hashtags=' + HASHTAG + '&url=' + enc(SITE_URL);

// 共有メニュー: 画像ファイルと文面をまとめて渡す(ここで選んだアプリには画像が添付される)
function nativeShare() {
  const f = canShareFile() ? cardFile() : null;
  const data = f ? { files: [f], text: shareFull } : { text: shareFull };
  const fail = () => note('ここでは共有メニューを開けません。下のボタンを使ってください');
  let p;
  try { p = navigator.share(data); } catch (e) { fail(); return; }
  if (p && p.catch) p.catch(err => { if (!err || err.name !== 'AbortError') fail(); });
}
// X・LINE などのボタン: リンクでは画像を渡せないので、画像をクリップボードに入れて(無理なら保存して)から投稿画面を開く
function onService(e) {
  if (!card.blob || attachedKey === card.key) return;   // 準備済みならそのまま開く
  attachedKey = card.key;
  if (!canCopyImage()) { saveCard(); return; }          // 保存して、リンクはそのまま開く
  e.preventDefault();
  const href = e.currentTarget.href;
  let done = false;
  const finish = ok => {
    if (done) return; done = true;
    if (ok) note('画像をコピーしました。投稿画面で貼り付け(Ctrl+V / 長押し)すると添付できます');
    else saveCard();
    const w = window.open(href, '_blank');
    if (w) { try { w.opener = null; } catch (err) { /* そのまま */ } }
    else note((ok ? '画像をコピーしました。' : '') + 'もう一度ボタンを押すと投稿画面が開きます');
  };
  try { navigator.clipboard.write([new ClipboardItem({ 'image/png': card.blob })]).then(() => finish(true), () => finish(false)); }
  catch (err) { finish(false); }
  setTimeout(() => finish(false), 1500);
}
function copyShare() {
  const btn = $('bCopy'), text = shareFull;
  const fallback = () => { btn.textContent = '文面をコピー'; window.prompt('この文面をコピーしてください', text); };
  const viaTextarea = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove(); return ok;
  };
  if (viaTextarea()) { btn.textContent = 'コピーしました'; return; }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => { btn.textContent = 'コピーしました'; }, fallback);
  else fallback();
}
function saveCard() {
  if (!card.canvas) { note('画像の作成中です。少し待ってからもう一度押してください'); return; }
  const url = card.blob ? URL.createObjectURL(card.blob) : card.dataUrl;
  if (!url) { note('この環境では保存できません。画像を長押しして保存してください'); return; }
  const a = document.createElement('a');
  a.href = url; a.download = 'dopa-snake-' + card.key.split('|')[0] + '.png';
  document.body.appendChild(a); a.click(); a.remove();
  if (card.blob) setTimeout(() => URL.revokeObjectURL(url), 4000);
  $('bSave').textContent = '保存しました';
  note('画像を保存しました。投稿に添付してください(保存できないときは画像を長押し / 右クリック)');
}

const KEYS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] };
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (shareOpen()) { if (e.key === 'Escape') closeSharePanel(); return; }
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  const dir = KEYS[k], go = k === 'Enter' || k === ' ';
  if (e.target && e.target.tagName === 'BUTTON' && go) return;   // ボタン上の Enter/Space はボタンに任せる
  if (k === 'm') { toggleMute(); return; }
  if (S.demo) { if (dir || go) { e.preventDefault(); startGame(); } return; }
  if (S.mode === 'over') { if (dir || go) { e.preventDefault(); retry(); } return; }
  if (S.mode === 'paused') { if (go || k === 'p' || k === 'Escape') { e.preventDefault(); resume(); } return; }
  if (S.mode === 'play') {
    if (dir) { e.preventDefault(); audioInit(); turn(dir[0], dir[1]); }
    else if (k === 'p' || k === 'Escape' || k === ' ') { e.preventDefault(); pause(); }
  }
});

let pt = null;
window.addEventListener('pointerdown', e => {
  audioInit();
  if (shareOpen()) { if (e.target === shareEl) closeSharePanel(); return; }   // パネルの外側タップで閉じる
  if (e.target.closest && e.target.closest('button')) return;
  if (S.demo) { startGame(); return; }
  if (S.mode === 'paused') { resume(); return; }
  if (S.mode === 'over') { retry(); return; }
  pt = { x: e.clientX, y: e.clientY, id: e.pointerId };
});
window.addEventListener('pointermove', e => {
  if (!pt || e.pointerId !== pt.id) return;
  const dx = e.clientX - pt.x, dy = e.clientY - pt.y, TH = 18;
  if (Math.abs(dx) < TH && Math.abs(dy) < TH) return;
  if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0); else turn(0, Math.sign(dy));
  pt.x = e.clientX; pt.y = e.clientY;   // 指を離さずに続けて曲がれる
});
const endPt = e => { if (pt && e.pointerId === pt.id) pt = null; };
window.addEventListener('pointerup', endPt);
window.addEventListener('pointercancel', endPt);
document.addEventListener('touchmove', e => { if (!shareOpen()) e.preventDefault(); }, { passive: false });   // シェア画面だけはスクロール可
document.addEventListener('contextmenu', e => { if (!(e.target.closest && e.target.closest('#cardWrap'))) e.preventDefault(); });   // カード画像は長押し保存できるように
document.addEventListener('gesturestart', e => e.preventDefault());

$('bStart').addEventListener('click', startGame);
$('bRetry').addEventListener('click', retry);
$('bShare').addEventListener('click', openSharePanel);
$('bNative').addEventListener('click', nativeShare);
$('bSave').addEventListener('click', saveCard);
['sX', 'sLine', 'sBsky', 'sThreads'].forEach(id => $(id).addEventListener('click', onService));
$('bCopy').addEventListener('click', copyShare);
$('bShareClose').addEventListener('click', closeSharePanel);
// 押したあとフォーカスを外す(残すと Space がポーズではなくそのボタンに効いてしまう)
const hudBtn = (id, fn) => $(id).addEventListener('click', e => { fn(); e.currentTarget.blur(); });
hudBtn('bPause', () => { if (S.mode === 'paused') resume(); else pause(); });
hudBtn('bSound', toggleMute);
hudBtn('bFx', toggleFx);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

function onResize() {
  const free = S.demo || S.mode === 'over';
  const changed = layout(free);
  if (S.demo && changed) newGame(true);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(onResize).catch(() => {});

/* ================= 起動 ================= */
setMuteUI(); setFxUI();
layout(true);
newGame(true);
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  if (S.mode !== 'paused') update(dt);
  render();
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
